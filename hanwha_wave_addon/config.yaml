name: Hanwha WAVE Media Server
version: "1.0.0"
slug: hanwha_wave
description: Runs the Hanwha Wisenet WAVE Media Server directly as a Home Assistant app.
url: https://github.com/sebastianengman/hanwha-wave-homeassistant
arch:
  - amd64
startup: services
boot: auto
init: false
host_network: true
ports:
  7001/tcp: 7001
webui: http://[HOST]:[PORT:7001]
map:
  - type: addon_config
    read_only: false
